<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador Dinámico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .contenedor {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            color: #0f172a;
        }

        .descripcion {
            color: #64748b;
            margin-bottom: 30px;
        }

        #valor {
            font-size: 80px;
            font-weight: bold;
            margin: 20px 0 30px;
            color: #0f172a;
            transition: color 0.3s;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #btn-incrementar {
            background-color: #16a34a;
            color: white;
        }

        #btn-restar {
            background-color: #dc2626;
            color: white;
        }

        #btn-reiniciar {
            background-color: #475569;
            color: white;
        }

        .informacion {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Contador Dinámico</h1>

        <p class="descripcion">
            Proyecto realizado con JavaScript Vainilla
        </p>

        <div id="valor">0</div>

        <div class="botones">

            <button id="btn-restar">
                − Restar
            </button>

            <button id="btn-incrementar">
                + Sumar
            </button>

        </div>

        <div class="botones" style="margin-top: 15px;">

            <button id="btn-reiniciar">
                Reiniciar
            </button>

        </div>

        <p class="informacion">
            El color cambia dependiendo del valor del contador.
        </p>

    </div>

    <!-- JavaScript -->
    <script src="app.js"></script>

</body>
</html>
